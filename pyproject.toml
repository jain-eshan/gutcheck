[project]
name = "gutcheck"
version = "1.1.0"
description = "Research buddy for Claude Code: check any idea, problem, or question against real-world signals"
requires-python = ">=3.10"
dependencies = [
    "mcp[cli]",
    "pytrends",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-recording>=0.13.4",
]

[tool.pytest.ini_options]
pythonpath = [".", "tests/eval"]
